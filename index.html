<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --primary: #8a2be2;
            --primary-hover: #9b4dca;
            --text-light: #f8f9fa;
            --text-muted: #8b949e;
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;

        }

        .app-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-light);
        }

        .balance-card {
            background: linear-gradient(135deg, var(--primary), #6a1b9a);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.3);
            transition: transform 0.3s ease;
        }

        .balance-card:hover {
            transform: translateY(-2px);
        }

        .balance-label {
            font-size: 14px;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .balance-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
        }

        select option {
            background: var(--card-bg);
            color: white;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .transaction-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom scrollbar para ficar bonito */
        .transaction-list::-webkit-scrollbar {
            width: 5px;
        }

        .transaction-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid transparent;
            transition: background 0.2s;
        }

        .transaction-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-title {
            font-weight: 600;
            font-size: 15px;
        }

        .item-type {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: capitalize;
            margin-top: 2px;
        }

        .item-amount {
            font-weight: 700;
            font-size: 16px;
        }

        .receita {
            border-left-color: var(--success);
        }

        .receita .item-amount {
            color: var(--success);
        }

        .despesa {
            border-left-color: var(--danger);
        }

        .despesa .item-amount {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="app-card">
            <header>
                <h1>FinanceLite</h1>

                <div
                    style="width: 35px; height: 35px; border-radius: 50%; background: #333; display:flex; justify-content:center; align-items:center; font-size:12px;">
                    US</div>
            </header>

            <div class="balance-card">
                <div class="balance-label">Saldo Disponível</div>
                <div class="balance-value" id="balanceDisplay">R$ 0,00</div>
            </div>

            <form id="transactionForm">
                <div class="form-group">
                    <select id="type" required>
                        <option value="" disabled selected>Selecione o tipo</option>
                        <option value="receita">Entrada (Receita)</option>
                        <option value="despesa">Saída (Despesa)</option>
                    </select>
                    <input type="text" id="title" placeholder="Descrição (ex: Salário, Ifood...)" required>

                    <input type="number" id="amount" step="0.01" min="0.01" placeholder="Valor (R$)" required>
                </div>
                <button type="submit">Lançar Transação</button>
            </form>

            <h2 style="margin-top: 30px;">Últimas Transações</h2>
            <ul class="transaction-list" id="transactionList">

            </ul>
        </div>
    </div>

    <script>
        // API url local
        const API_URL = "http://localhost:8000";

        // formata moeda BRL
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        }

        async function loadData() {
            try {
                // pegando saldo
                let res = await fetch(`${API_URL}/balance`);
                let data = await res.json();
                document.getElementById('balanceDisplay').innerText = formatCurrency(data.balance);

                // pegando lista
                let resTrans = await fetch(`${API_URL}/transactions`);
                let transactions = await resTrans.json();

                const list = document.getElementById('transactionList');
                list.innerHTML = '';

                if (transactions.length === 0) {
                    list.innerHTML = '<div class="empty-state">Nenhuma transação registrada ainda.</div>';
                    return;
                }

                // invertendo array pra mostrar a mais nova no topo 
                transactions.reverse().forEach(t => {
                    const li = document.createElement('li');
                    li.className = `transaction-item ${t.type}`; // aplica classe receita ou despesa

                    li.innerHTML = `
                        <div class="item-info">
                            <span class="item-title">${t.title}</span>
                            <span class="item-type">${t.type}</span>
                        </div>
                        <span class="item-amount">
                            ${t.type === 'despesa' ? '-' : '+'} ${formatCurrency(t.amount)}
                        </span>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Erro ao carregar dados. A API ta rodando???", err);
            }
        }

        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // evita o reload da pagina

            const payload = {
                type: document.getElementById('type').value,
                title: document.getElementById('title').value,
                amount: parseFloat(document.getElementById('amount').value)
            };

            try {
                await fetch(`${API_URL}/transactions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('title').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('type').value = '';

                loadData();
            } catch (err) {
                alert("Falha ao salvar. Verifique o console.");
                console.log(err);
            }
        });

        loadData();
    </script>
</body>

</html>
